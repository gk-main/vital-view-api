spring:
  application:
    name: vital-view
  datasource:
    url: jdbc:mariadb://localhost:3306/vital_view
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080
  servlet:
    context-path: /main

# Swagger Setting
springdoc:
  packages-to-scan: org.main.vitalview
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  cache:
    disabled: true
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
